# cargo deny configuration (updated for cargo-deny >= 0.16 format)
#
# https://embarkstudios.github.io/cargo-deny/
# Migration from old format: see https://github.com/EmbarkStudios/cargo-deny/pull/611

[advisories]
# "all" checks both workspace and transitive crates; "none" disables.
# vulnerability, notice fields were removed in cargo-deny 0.16 — vuln checking
# is always active and controlled by the ignore list below.
unmaintained = "none"
yanked = "deny"

# Triaged advisories. Kept in sync with .cargo/audit.toml (VAL-348): every
# fixable advisory was cleared by dependency bumps (h2, postgres-protocol,
# tokio-postgres, quinn-proto, rustls, rustls-webpki, anyhow, lru, and
# parquet 60 / arrow 60 which drops paste). What remains has no fixed
# upstream release. Review before each release; remove on upstream fix.
# Note: serde_cbor (RUSTSEC-2021-0127) is NOT listed here — unmaintained =
# "none" above, so cargo-deny never flags it (listing it triggers an
# advisory-not-detected warning); its live suppression is in
# .cargo/audit.toml, which runs cargo audit --deny unmaintained.
ignore = [
    # RUSTSEC-2026-0194 / RUSTSEC-2026-0195: quick-xml <0.41 DoS advisories.
    # Pinned by rio_xml 0.8.6 (^0.36) and sparesults 0.3.4 / oxrdfxml 0.2.4
    # (^0.37) — latest upstream releases; none accepts quick-xml >=0.41.
    # Exposure limited to RDF/XML ingestion paths.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml pinned <0.41 by rio_xml 0.8.6 / sparesults 0.3.4 / oxrdfxml 0.2.4 (latest upstream releases); tracked in VAL-348" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml pinned <0.41 by rio_xml 0.8.6 / sparesults 0.3.4 / oxrdfxml 0.2.4 (latest upstream releases); tracked in VAL-348" },
]

[licenses]
# Allow OSI-approved and widely-used permissive / weak-copyleft licences.
# Licenses not in this list will be denied (cargo-deny default behaviour).
# NOTE: deny[], copyleft, allow-osi-fsf-free removed in cargo-deny 0.16.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
# Disallow multiple versions of the same crate unless explicitly skipped.
multiple-versions = "warn"
# Disallow wildcard dependencies.
wildcards = "deny"
# Known duplicate-version exceptions (indirect, pinned by different dep trees).
skip = []

[sources]
# Only allow crates from crates.io; no git or path deps in the published crate.
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
